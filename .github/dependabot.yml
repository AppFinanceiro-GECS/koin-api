version: 2
updates:
  # Política (#32): patch entra sozinho com CI verde (auto-merge, ver
  # .github/workflows/dependabot-automerge.yml); minor e major pedem revisão.
  # O requirements.txt é um lock com hash gerado do requirements.in (make lock).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      python-patch:
        update-types: [patch]
      python-minor:
        update-types: [minor]
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
