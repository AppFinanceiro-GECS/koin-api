name: CI

on:
  push:
    branches: [main, prod]
  pull_request:
    branches: [main, prod]

env:
  IMAGE: ghcr.io/appfinanceiro-gecs/koin-api

jobs:
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # CLI em container: a gitleaks-action exige licença paga em organizações
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.28.0 \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1

  test:
    name: Lint + Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff
      # O lock (requirements.txt) tem que bater com o requirements.in (#32)
      - name: Lock em dia
        run: |
          pip install uv
          # parte do lock atual: versão nova publicada no PyPI não acusa; .in mudado sem make lock, sim
          cp requirements.txt /tmp/lock.txt
          uv pip compile requirements.in --universal --python-version 3.12 --generate-hashes -o /tmp/lock.txt --quiet
          diff <(grep -v '^#' requirements.txt) <(grep -v '^#' /tmp/lock.txt) \
            || { echo "::error::requirements.txt desatualizado: rode make lock"; exit 1; }
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff format)
        run: ruff format --check .
      # Piso de cobertura (#28): 48% no início, 57% depois do #40; suba junto com a cobertura
      - name: Run tests
        run: |
          set -o pipefail
          pytest tests/ -v --cov=app --cov-report=term --cov-fail-under=55 | tee pytest.out
          echo "### Cobertura" >> "$GITHUB_STEP_SUMMARY"
          grep '^TOTAL' pytest.out | awk '{print "Total: **" $NF "** (piso 55%)"}' >> "$GITHUB_STEP_SUMMARY"
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          SECRET_KEY: test-secret-key
          DEBUG: "true"
      # Contrato para o koin-app gerar os tipos (#54); baixe em Actions → artefatos
      - name: Export OpenAPI
        run: python scripts/export_openapi.py openapi.json
      - uses: actions/upload-artifact@v7
        with:
          name: openapi
          path: openapi.json
          retention-days: 30

  test-postgres:
    name: Testes (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # Mesmos testes do job SQLite, contra o banco de produção: pega o que o SQLite esconde
      - name: Run tests
        run: pytest tests/ -q
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
          SECRET_KEY: test-secret-key
          DEBUG: "true"

  migrations:
    name: Migrações (SQLite + Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: test-secret-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # make dev sem Docker usa SQLite: a base nova precisa migrar até o head
      - name: alembic upgrade head (SQLite)
        run: alembic upgrade head
        env:
          DATABASE_URL: sqlite+aiosqlite:///./migrations.db
      - name: alembic upgrade → downgrade -1 → upgrade (Postgres)
        run: alembic upgrade head && alembic downgrade -1 && alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres

  audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit
      - name: Dependency audit
        run: pip-audit -r requirements.txt

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    needs: [test, audit, migrations]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare .env
        run: cp .env.example .env && sed -i "s#^SECRET_KEY=.*#SECRET_KEY=ci-$(openssl rand -hex 16)#" .env
      - name: Build and start stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Health check
        run: curl -fsS http://localhost:8000/health
      # Pacotes do sistema da imagem (as libs Python já passam pelo pip-audit).
      # Bloqueia crítica com correção disponível; alta vai para o resumo do job.
      - name: Scan da imagem (Trivy)
        run: |
          trivy() { docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache aquasec/trivy:0.57.0 "$@"; }
          trivy image --quiet --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --format table koin-api:local \
            | tee trivy.txt
          { echo '### Trivy (alta e crítica com correção)'; echo '```'; cat trivy.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          trivy image --quiet --scanners vuln --ignore-unfixed --severity CRITICAL --exit-code 1 --skip-db-update koin-api:local
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v

  # Build nativo por arquitetura (a VM da Oracle é ARM) e push só por digest; o job publish junta.
  build-image:
    name: Build image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: docker
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/prod')
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: GIT_COMMIT=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  publish:
    name: Publish image (GHCR)
    runs-on: ubuntu-latest
    needs: build-image
    # main: tags `main` + `sha-xxxxxxx` (homologação). prod: `prod` + `latest` + `sha-xxxxxxx`.
    permissions:
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/prod' }}
            type=sha,format=short
      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  # main -> homologação, prod -> produção, na VM da Oracle (docs/infra/DEPLOY.md).
  # A chave SSH só executa o /usr/local/bin/koin-deploy (deploy/koin-deploy.sh), que faz rollback se a API não subir.
  deploy:
    name: Deploy (${{ github.ref_name == 'prod' && 'produção' || 'homologação' }})
    runs-on: ubuntu-latest
    needs: publish
    environment:
      name: ${{ github.ref_name == 'prod' && 'producao' || 'homologacao' }}
      url: ${{ vars.PUBLIC_URL }}
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy
        env:
          KOIN_ENV: ${{ github.ref_name == 'prod' && 'prod' || 'hml' }}
          TAG: ${{ needs.publish.outputs.tag }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          printf '%s' "$GHCR_TOKEN" > ghcr_token
          tar -czf - deploy ghcr_token | ssh -i ~/.ssh/deploy "deploy@$DEPLOY_HOST" "$KOIN_ENV $TAG"
      - name: Health check público
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          for _ in $(seq 1 12); do
            curl -fsS "$PUBLIC_URL/health" && exit 0
            sleep 5
          done
          exit 1

  smoke-e2e:
    name: Smoke E2E (homologação)
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: homologacao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx
      # Usuário de QA da hml nos secrets do environment homologacao; sem eles o passo é pulado
      - name: Fluxo principal contra a hml
        env:
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: python scripts/smoke_e2e.py "${{ vars.PUBLIC_URL }}"

  release:
    name: Release (tag vX.Y.Z)
    runs-on: ubuntu-latest
    needs: [deploy, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: openapi
      # Versão do pyproject.toml; promover para prod sem subir a versão não cria tag nova
      - name: Tag e release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version já existe; suba a versão no pyproject.toml para gerar outra release"
            exit 0
          fi
          gh release create "v$version" openapi.json --target "$GITHUB_SHA" --title "v$version" --generate-notes
