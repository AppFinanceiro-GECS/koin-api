name: CI

on:
  push:
    branches: [main, prod]
  pull_request:
    branches: [main, prod]

env:
  IMAGE: ghcr.io/appfinanceiro-gecs/koin-api

jobs:
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # CLI em container: a gitleaks-action exige licença paga em organizações
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.28.0 \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1

  test:
    name: Lint + Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff format)
        run: ruff format --check .
      - name: Run tests
        run: pytest tests/ -v
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          SECRET_KEY: test-secret-key
          DEBUG: "true"

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Prepare .env
        run: cp .env.example .env && sed -i "s#^SECRET_KEY=.*#SECRET_KEY=ci-$(openssl rand -hex 16)#" .env
      - name: Build and start stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Health check
        run: curl -fsS http://localhost:8000/health
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v

  # Build nativo por arquitetura (a VM da Oracle é ARM) e push só por digest; o job publish junta.
  build-image:
    name: Build image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: docker
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/prod')
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  publish:
    name: Publish image (GHCR)
    runs-on: ubuntu-latest
    needs: build-image
    # main: tags `main` + `sha-xxxxxxx` (homologação). prod: `prod` + `latest` + `sha-xxxxxxx`.
    permissions:
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/prod' }}
            type=sha,format=short
      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  # main -> homologação, prod -> produção, na VM da Oracle (docs/infra/DEPLOY.md).
  # A chave SSH só executa o /usr/local/bin/koin-deploy (deploy/koin-deploy.sh), que faz rollback se a API não subir.
  deploy:
    name: Deploy (${{ github.ref_name == 'prod' && 'produção' || 'homologação' }})
    runs-on: ubuntu-latest
    needs: publish
    environment:
      name: ${{ github.ref_name == 'prod' && 'producao' || 'homologacao' }}
      url: ${{ vars.PUBLIC_URL }}
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy
        env:
          KOIN_ENV: ${{ github.ref_name == 'prod' && 'prod' || 'hml' }}
          TAG: ${{ needs.publish.outputs.tag }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          printf '%s' "$GHCR_TOKEN" > ghcr_token
          tar -czf - deploy ghcr_token | ssh -i ~/.ssh/deploy "deploy@$DEPLOY_HOST" "$KOIN_ENV $TAG"
      - name: Health check público
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          for _ in $(seq 1 12); do
            curl -fsS "$PUBLIC_URL/health" && exit 0
            sleep 5
          done
          exit 1
