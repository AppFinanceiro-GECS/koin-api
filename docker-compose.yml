# Stack local / base: API + PostgreSQL.
#   make up        (ou: docker compose up -d --build)
# Em produção use junto com docker-compose.prod.yml (Caddy + HTTPS).

name: biveto

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-biveto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-biveto_secret}
      POSTGRES_DB: ${POSTGRES_DB:-biveto_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Só na máquina local; 5433 para não colidir com um Postgres instalado
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  api:
    build: .
    image: ${API_IMAGE:-biveto-api:local}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-biveto}:${POSTGRES_PASSWORD:-biveto_secret}@db:5432/${POSTGRES_DB:-biveto_db}
      UPLOAD_DIR: /app/uploads
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    ports:
      - "${API_PORT:-8000}:8000"
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  postgres_data:
  uploads:
